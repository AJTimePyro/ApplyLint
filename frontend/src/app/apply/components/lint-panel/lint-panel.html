<div hlmCard class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-xs uppercase tracking-wide text-zinc-500">Recruiter lint</p>
      <h2 class="text-lg font-medium text-zinc-100 mt-1">Automated review</h2>
    </div>
    <span
      hlmBadge
      [variant]="data().decision === 'approve' ? 'secondary' : 'destructive'"
      [class]="data().decision === 'approve' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : ''"
      class="uppercase text-[11px] tracking-wide"
    >
      {{ data().decision }}
    </span>
  </div>

  <p class="text-sm text-zinc-400 leading-relaxed">{{ data().summary }}</p>

  <hlm-separator />

  <div class="space-y-3">
    @for (reason of data().reasons; track $index) {
    <div class="flex gap-3 py-2 border-b border-zinc-800/60 last:border-0">
      <span
        hlmBadge
        [variant]="severityVariant(reason.severity)"
        [class]="severityClass(reason.severity)"
        class="shrink-0 uppercase text-[10px] tracking-wide mt-0.5"
      >
        {{ reason.severity }}
      </span>
      <p class="text-sm text-zinc-400 leading-relaxed">{{ reason.explanation }}</p>
    </div>
    }
  </div>
</div>
