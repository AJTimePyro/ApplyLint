<div hlmCard class="space-y-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs uppercase tracking-wide text-zinc-500">{{ eyebrow() }}</p>
      <h2 class="text-lg font-medium text-zinc-100 mt-1">{{ data().subject }}</h2>
    </div>
    <button hlmBtn variant="outline" size="sm" class="shrink-0" (click)="copy()">
      {{ copied() ? 'Copied' : 'Copy' }}
    </button>
  </div>
  <p class="text-sm text-zinc-400 leading-relaxed whitespace-pre-wrap">{{ data().body }}</p>
</div>
